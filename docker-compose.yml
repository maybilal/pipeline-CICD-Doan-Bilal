# Lance les services dont le projet a besoin, chacun dans un conteneur Docker.
#   Tout démarrer         :  docker compose up -d
#   Démarrer un seul      :  docker compose up -d s3
#   Arrêter               :  docker compose down
#   Tout effacer (données comprises) : docker compose down -v
services:
  # --- La base de données relationnelle (Niveau 1) ---------------------------
  postgres:
    image: postgres:16
    container_name: pipeline_postgres
    environment:
      POSTGRES_USER: pipeline
      POSTGRES_PASSWORD: pipeline
      POSTGRES_DB: transactions
    ports:
      - "5432:5432"            # rend la base accessible depuis ton ordinateur
    volumes:
      - pgdata:/var/lib/postgresql/data   # les données survivent à un redémarrage
    healthcheck:               # Docker vérifie régulièrement que la base répond
      test: ["CMD-SHELL", "pg_isready -U pipeline -d transactions"]
      interval: 2s
      timeout: 3s
      retries: 15

  # --- Le stockage de fichiers compatible S3 (Niveau 2) ----------------------
  s3:
    image: rustfs/rustfs:1.0.4
    container_name: pipeline_s3
    environment:
      RUSTFS_ACCESS_KEY: pipeline-access        # "identifiant" pour accéder au S3
      RUSTFS_SECRET_KEY: pipeline-secret-123    # "mot de passe" (projet d'école uniquement)
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "9000:9000"            # l'API S3 (utilisée par le code Python)
      - "9001:9001"            # l'interface web, pour voir les fichiers dans un navigateur
    volumes:
      - s3data:/data           # les fichiers survivent à un redémarrage
    command: /data

  # --- Le petit modèle de langage (Niveau 3, option 3) ------------------------
  slm:
    image: ollama/ollama:0.40.13
    container_name: pipeline_slm
    ports:
      - "11434:11434"          # l'API d'Ollama (utilisée par le code Python)
    volumes:
      - slmdata:/root/.ollama  # le modèle téléchargé est gardé : pas de 2e téléchargement

volumes:
  pgdata:
  s3data:
  slmdata: