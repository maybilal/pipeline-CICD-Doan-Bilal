# Pipeline CI : à chaque "push" sur GitHub, un ordinateur de GitHub exécute
# automatiquement toutes les étapes ci-dessous, de A à Z.

name: Pipeline Data

on:
  push:                 # à chaque envoi de code
  pull_request:         # à chaque proposition de modification
  workflow_dispatch:    # + un bouton "Run workflow" pour la lancer à la main

jobs:
  pipeline:
    runs-on: ubuntu-latest   # un ordinateur Linux tout neuf, prêté par GitHub

    # PostgreSQL lancé à côté, dans un conteneur Docker (comme notre docker-compose.yml)
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pipeline
          POSTGRES_PASSWORD: pipeline
          POSTGRES_DB: transactions
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pipeline -d transactions"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    # Informations de connexion lues par base_de_donnees.py
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: pipeline
      DB_PASSWORD: pipeline
      DB_NAME: transactions
      PGPASSWORD: pipeline     # pour la commande psql
      PYTHONUNBUFFERED: "1"    # affiche les messages Python en direct dans les logs
      # Informations de connexion lues par stockage_s3.py
      S3_ENDPOINT: http://localhost:9000
      S3_ACCESS_KEY: pipeline-access
      S3_SECRET_KEY: pipeline-secret-123
      S3_BUCKET: transactions
      # Informations de connexion lues par slm.py
      SLM_URL: http://localhost:11434
      SLM_MODELE: qwen2.5:1.5b

    steps:
      - name: Récupérer le code du dépôt
        uses: actions/checkout@v5

      # Niveau 2 : le S3 est démarré AU DÉBUT, avec le même docker-compose.yml qu'en local
      - name: "N2-1. Démarrer le service S3 (et le SLM du Niveau 3)"
        run: |
          docker compose up -d s3 slm
          docker ps

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Niveau 3 (option 2) : le logiciel d'OCR, avec la langue française
      - name: "N3. Installer Tesseract (OCR)"
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q tesseract-ocr tesseract-ocr-fra
          tesseract --version

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      # Niveau 3 (option 3) : téléchargement du modèle (~1 Go) dans le service Ollama
      - name: "N3. Préparer le SLM (téléchargement du modèle)"
        run: python preparer_slm.py

      - name: "1. Générer les fichiers CSV"
        run: |
          python generate_csv.py
          ls -l data/

      # Attente du S3, création du bucket, envoi, puis vérification de présence
      - name: "N2-2. Créer le bucket et y envoyer les CSV"
        run: python envoyer_s3.py

      - name: "2. Mettre en place la base de données"
        run: psql -h localhost -U pipeline -d transactions -f sql/schema.sql

      # N2-3 : les fichiers sont lus depuis le S3, plus depuis le disque
      - name: "3 et 4. S3 -> récupération -> chargement -> traitement -> base"
        run: python main.py

      - name: "7a. Relancer la pipeline : aucun fichier ne doit être retraité"
        run: |
          python main.py
          NB=$(psql -h localhost -U pipeline -d transactions -tAc "SELECT COUNT(*) FROM transactions")
          echo "Transactions en base après la relance : $NB (attendu : 36)"
          test "$NB" -eq 36

      - name: "7b. Retry base : nouveau fichier dans S3 + 2 pannes simulées de la base"
        run: |
          python generate_csv.py --seed 7 --nb-fichiers 1 --prefixe lot_retry_bdd --sans-reference --dossier data_nouveaux
          python envoyer_s3.py data_nouveaux
          SIMULER_PANNES_BDD=2 python main.py

      - name: "N2-4. Retry S3 : nouveau fichier + 2 pannes simulées lors de la récupération"
        run: |
          rm -rf data_nouveaux
          python generate_csv.py --seed 11 --nb-fichiers 1 --prefixe lot_retry_s3 --sans-reference --dossier data_nouveaux
          python envoyer_s3.py data_nouveaux
          SIMULER_PANNES_S3=2 python main.py

      # Niveau 3 (option 2) : des images dans le S3 -> OCR -> même flux que les CSV
      - name: "N3-OCR. Images d'avis de virement -> OCR -> validation -> base"
        run: |
          python generate_images.py
          python envoyer_s3.py data_images
          python main.py
          psql -h localhost -U pipeline -d transactions \
            -c "SELECT datetime_transaction, iban_origine, iban_destinataire, montant, flag
                FROM transactions WHERE datetime_transaction BETWEEN '2026-02-01' AND '2026-02-28'
                ORDER BY datetime_transaction;"

      # Niveau 3 (option 3) : du texte brut dans le S3 -> SLM -> même flux que les CSV
      - name: "N3-SLM. Texte brut -> SLM -> validation -> base"
        run: |
          python generate_textes.py
          python envoyer_s3.py data_textes
          python main.py
          psql -h localhost -U pipeline -d transactions \
            -c "SELECT datetime_transaction, iban_origine, iban_destinataire, montant, flag
                FROM transactions WHERE datetime_transaction >= '2026-09-01'
                ORDER BY datetime_transaction;"

      # Si un seul test échoue, cette étape (et donc la pipeline) passe au ROUGE.
      - name: "5. Tests unitaires et d'intégration"
        run: pytest -v